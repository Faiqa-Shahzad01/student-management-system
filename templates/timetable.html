{% extends 'base.html' %}{% block content %}<div class="heading"><div><small>SCHEDULING</small><h1>Timetable</h1></div></div><div class="panel mb-4"><form method="post" class="row g-2"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="col-md-2"><input class="form-control" name="class_name" placeholder="Class" required></div><div class="col-md-2"><select class="form-select" name="weekday">{% for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] %}<option>{{d}}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" type="time" name="start" required></div><div class="col-md-2"><input class="form-control" type="time" name="end" required></div><div class="col-md-2"><input class="form-control" name="subject" placeholder="Subject" required></div><div class="col-md-2"><input class="form-control" name="teacher" placeholder="Teacher"></div><div class="col-12"><button class="btn btn-primary">Add timetable entry</button></div></form></div><div class="panel"><table class="table"><tr><th>Day</th><th>Time</th><th>Class</th><th>Subject</th><th>Teacher</th></tr>{% for e in items %}<tr><td>{{e.weekday}}</td><td>{{e.start}}–{{e.end}}</td><td>{{e.class_name}}</td><td>{{e.subject}}</td><td>{{e.teacher or '—'}}</td></tr>{% else %}<tr><td colspan="5">No entries.</td></tr>{% endfor %}</table></div>{% endblock %}

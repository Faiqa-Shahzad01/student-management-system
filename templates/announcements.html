{% extends 'base.html' %}{% block content %}<div class="heading"><div><small>COMMUNICATION</small><h1>Announcements</h1></div></div><div class="panel mb-4"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input class="form-control mb-2" name="title" placeholder="Announcement title" required><textarea class="form-control mb-2" name="body" rows="3" placeholder="Write announcement..." required></textarea><button class="btn btn-primary">Publish</button></form></div><div class="row g-3">{% for a in items %}<div class="col-md-6"><div class="panel"><h5>{{a.title}}</h5><p>{{a.body}}</p><small>{{a.created_at.strftime('%d %b %Y')}}</small></div></div>{% else %}<p>No announcements.</p>{% endfor %}</div>{% endblock %}
